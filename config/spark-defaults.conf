# Spark 3 + Iceberg (CDP 7.3.2 edge — spark-defaults.conf 에 병합)
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.hive_prod=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hive_prod.type=hive
spark.sql.catalog.hive_prod.warehouse=ofs://ozone1784520717/vol1/bucket1/warehouse
spark.sql.catalog.hive_prod.io-impl=org.apache.iceberg.hadoop.HadoopFileIO
spark.sql.defaultCatalog=hive_prod

spark.hadoop.hive.metastore.uris=thrift://ccycloud-1.jshin.root.comops.site:9083,thrift://ccycloud-3.jshin.root.comops.site:9083

spark.kerberos.principal=systest@QE-INFRA-AD.CLOUDERA.COM
spark.kerberos.keytab=/cdep/keytabs/systest.keytab
spark.yarn.principal=systest@QE-INFRA-AD.CLOUDERA.COM
spark.yarn.keytab=/cdep/keytabs/systest.keytab

spark.hadoop.fs.ofs.impl=org.apache.hadoop.fs.ozone.RootedOzoneFileSystem
spark.hadoop.fs.o3fs.impl=org.apache.hadoop.fs.ozone.OzoneFileSystem
